name: Refresh language card

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_languages.py
      - .github/workflows/languages.yml

permissions:
  contents: write

concurrency:
  group: language-card
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check language aggregation
        run: python -m unittest discover -s tests
      - name: Generate card
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_languages.py
      - name: Commit updated card
        run: |
          git add assets/languages.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public language statistics'
          git pull --rebase origin main
          git push origin HEAD:main
